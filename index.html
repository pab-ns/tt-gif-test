<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikGIF — TikTok to GIF Converter</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --border: rgba(255,255,255,0.08);
  --border-hover: rgba(255,255,255,0.18);
  --accent: #fe2c55;
  --accent2: #25f4ee;
  --green: #00c864;
  --text: #f0f0f0;
  --text-muted: #888;
  --text-dim: #444;
  --radius: 12px;
  --font-mono: 'Space Mono', monospace;
  --font-sans: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); min-height: 100vh; overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(254,44,85,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(254,44,85,0.03) 1px, transparent 1px);
  background-size: 40px 40px; pointer-events: none; z-index: 0;
}
.wrapper {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto; padding: 48px 24px 80px;
}

/* Header */
.header { text-align: center; margin-bottom: 48px; }
.logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.logo-icon {
  width: 48px; height: 48px; background: var(--accent);
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.logo-icon::after {
  content: ''; position: absolute; top: -4px; right: -4px;
  width: 20px; height: 20px; background: var(--accent2); border-radius: 50%;
}
.logo-icon svg { position: relative; z-index: 1; }
.logo-text { font-family: var(--font-mono); font-size: 28px; font-weight: 700; letter-spacing: -1px; }
.logo-text span { color: var(--accent); }
.logo-text em { color: var(--accent2); font-style: normal; }
.tagline { font-size: 14px; color: var(--text-muted); }

/* Paste zone */
.paste-zone {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  transition: border-color 0.2s;
}
.paste-zone:focus-within { border-color: rgba(254,44,85,0.4); }
.paste-label {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--text-muted); margin-bottom: 12px;
  text-transform: uppercase; letter-spacing: 0.8px; font-weight: 500;
}
.url-count {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--accent2); background: rgba(37,244,238,0.08);
  padding: 2px 10px; border-radius: 20px;
}
#url-input {
  width: 100%; height: 140px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: var(--font-mono); font-size: 12px;
  line-height: 1.8; padding: 14px 16px; resize: vertical;
  outline: none; transition: border-color 0.2s; caret-color: var(--accent);
}
#url-input::placeholder { color: var(--text-dim); }
#url-input:focus { border-color: rgba(254,44,85,0.3); }
.paste-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }

/* Settings bar */
.settings-bar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px; margin-bottom: 20px;
  display: flex; gap: 24px; flex-wrap: wrap; align-items: center;
}
.setting { display: flex; flex-direction: column; gap: 6px; }
.setting-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; }
.setting select, .setting input[type=range] {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: var(--font-sans);
  font-size: 13px; padding: 6px 10px; outline: none; cursor: pointer;
}
.setting select:focus { border-color: var(--accent2); }
.setting-val {
  font-family: var(--font-mono); font-size: 12px; color: var(--accent2);
  min-width: 40px; display: inline-block;
}
.setting input[type=range] {
  padding: 0; width: 120px; accent-color: var(--accent); border: none;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 8px;
  font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
}
.btn-outline { background: transparent; border-color: var(--border-hover); color: var(--text-muted); }
.btn-outline:hover { border-color: var(--accent2); color: var(--accent2); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #e01e45; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-green { background: var(--green); color: #000; border-color: var(--green); font-weight: 600; }
.btn-green:hover { background: #00b057; }

/* Video grid */
.video-grid { display: flex; flex-direction: column; gap: 14px; }

/* Card */
.gif-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s;
}
.gif-card:hover { border-color: var(--border-hover); }

.card-header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.card-avatar {
  width: 36px; height: 36px; border-radius: 50%; background: var(--surface2);
  border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 10px; color: var(--accent2); font-weight: 700; flex-shrink: 0;
}
.card-info { flex: 1; min-width: 0; }
.card-handle { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--accent2); margin-bottom: 2px; }
.card-url { font-size: 11px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-status { flex-shrink: 0; }

.status-badge {
  font-size: 12px; padding: 4px 12px; border-radius: 6px; font-weight: 500;
  white-space: nowrap;
}
.s-pending  { background: var(--surface2); color: var(--text-muted); }
.s-fetching { background: rgba(37,244,238,0.1); color: var(--accent2); }
.s-capturing{ background: rgba(255,180,0,0.1); color: #ffb400; }
.s-encoding { background: rgba(124,109,250,0.1); color: #a89cfc; }
.s-done     { background: rgba(0,200,100,0.1); color: var(--green); }
.s-error    { background: rgba(254,44,85,0.1); color: var(--accent); }

/* Card body */
.card-body { padding: 16px; display: flex; gap: 16px; align-items: flex-start; }

.card-preview {
  flex-shrink: 0; width: 160px; height: 90px;
  background: var(--surface2); border-radius: 8px;
  border: 1px solid var(--border); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 12px;
}
.card-preview img { width: 100%; height: 100%; object-fit: cover; }
.card-preview canvas { width: 100%; height: 100%; object-fit: cover; display: none; }

.card-progress-wrap { flex: 1; min-width: 0; }
.card-progress-label {
  font-size: 12px; color: var(--text-muted); margin-bottom: 8px;
  display: flex; justify-content: space-between;
}
.card-progress-label span { font-family: var(--font-mono); font-size: 11px; color: var(--accent2); }
.progress-track { height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width 0.2s; border-radius: 2px; }

.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.dl-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
  font-family: var(--font-sans); text-decoration: none;
}
.dl-btn-gif {
  background: var(--green); color: #000; border-color: var(--green);
}
.dl-btn-gif:hover { background: #00b057; }
.dl-btn-gif:disabled { opacity: 0.3; cursor: not-allowed; }
.dl-btn-retry {
  background: transparent; border-color: var(--border-hover); color: var(--text-muted);
}
.dl-btn-retry:hover { border-color: var(--accent); color: var(--accent); }

/* Hidden video + canvas for processing */
#processing-area { position: fixed; top: -9999px; left: -9999px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface2); border: 1px solid var(--border-hover);
  border-radius: 10px; padding: 12px 18px; font-size: 13px; color: var(--text);
  transform: translateY(80px); opacity: 0;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 999; max-width: 320px;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { border-color: rgba(0,200,100,0.4); }
.toast.error   { border-color: rgba(254,44,85,0.4); }

.spin { display: inline-block; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Size preview */
.size-preview-setting { min-width: 180px; }
.size-preview-wrap { display: flex; flex-direction: column; gap: 8px; }
.size-bar-track {
  position: relative; height: 6px;
  background: var(--surface2); border-radius: 3px; overflow: visible;
  width: 100%; min-width: 160px;
}
.size-bar-fill {
  height: 100%; border-radius: 3px; width: 0%;
  background: var(--green);
  transition: width 0.3s ease, background 0.3s ease;
  max-width: 100%;
}
.size-bar-fill.warn  { background: #ffb400; }
.size-bar-fill.over  { background: var(--accent); }
.size-bar-limit {
  position: absolute; top: -3px; right: 0;
  width: 2px; height: 12px;
  background: var(--border-hover); border-radius: 1px;
}
.size-preview-nums {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.size-preview-val {
  font-family: var(--font-mono); font-size: 13px; font-weight: 700;
  color: var(--green); transition: color 0.3s;
}
.size-preview-val.warn { color: #ffb400; }
.size-preview-val.over { color: var(--accent); }
.size-preview-limit { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

.empty-hint {
  text-align: center; padding: 48px 24px;
  color: var(--text-dim); font-size: 14px; line-height: 1.8;
}
.empty-hint strong { color: var(--text-muted); display: block; margin-bottom: 6px; font-size: 16px; }
</style>
</head>
<body>
<div class="wrapper">

  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>
        </svg>
      </div>
      <div class="logo-text">Tik<span>GIF</span></div>
    </div>
    <p class="tagline">Paste TikTok URLs — converts the first 10 seconds to a GIF, right in your browser</p>
  </div>

  <!-- URL Input -->
  <div class="paste-zone">
    <div class="paste-label">
      Paste TikTok URLs — one per line
      <span class="url-count" id="url-count"></span>
    </div>
    <textarea id="url-input"
      placeholder="https://www.tiktok.com/@user/video/123&#10;https://www.tiktok.com/@user2/video/456"
      spellcheck="false"></textarea>
    <div class="paste-actions">
      <button class="btn btn-outline" id="clear-btn">Clear</button>
      <button class="btn btn-primary" id="load-btn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Convert to GIF
      </button>
    </div>
  </div>

  <!-- Settings -->
  <div class="settings-bar">
    <div class="setting">
      <span class="setting-label">Duration</span>
      <select id="setting-duration">
        <option value="5">5 seconds</option>
        <option value="10" selected>10 seconds</option>
        <option value="15">15 seconds</option>
        <option value="30">30 seconds</option>
      </select>
    </div>
    <div class="setting">
      <span class="setting-label">FPS</span>
      <select id="setting-fps">
        <option value="8">8 fps — smaller</option>
        <option value="12" selected>12 fps — default</option>
        <option value="18">18 fps — smoother</option>
      </select>
    </div>
    <div class="setting">
      <span class="setting-label">Width (px)</span>
      <select id="setting-width">
        <option value="320">320px — small</option>
        <option value="480">480px — medium</option>
        <option value="720" selected>720px — HD</option>
      </select>
    </div>
    <div class="setting">
      <span class="setting-label">Quality</span>
      <div style="display:flex;align-items:center;gap:10px">
        <input type="range" id="setting-quality" min="1" max="20" value="10">
        <span class="setting-val" id="quality-val">10</span>
      </div>
      <span style="font-size:10px;color:var(--text-dim)">1 = best, 20 = fastest</span>
    </div>
    <div class="setting size-preview-setting">
      <span class="setting-label">Est. file size</span>
      <div class="size-preview-wrap">
        <div class="size-bar-track">
          <div class="size-bar-fill" id="size-bar-fill"></div>
          <div class="size-bar-limit"></div>
        </div>
        <div class="size-preview-nums">
          <span class="size-preview-val" id="size-preview-val">—</span>
          <span class="size-preview-limit">/ 50 MB max</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Cards -->
  <div class="video-grid" id="video-grid">
    <div class="empty-hint" id="empty-hint">
      <strong>No videos yet</strong>
      Paste TikTok URLs above and hit Convert to GIF
    </div>
  </div>

</div>

<!-- Hidden processing area -->
<div id="processing-area">
  <video id="proc-video" crossorigin="anonymous" muted playsinline preload="auto"></video>
  <canvas id="proc-canvas"></canvas>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────
var items = [];  // { id, url, handle, videoId, status, gifBlob, error }
var pendingDownloads = [];  // blobs queued to download
var autoDownloadInterval = null;

// ─── Elements ─────────────────────────────────────────────────────────────
var urlInput  = document.getElementById('url-input');
var loadBtn   = document.getElementById('load-btn');
var urlCount  = document.getElementById('url-count');
var videoGrid = document.getElementById('video-grid');
var emptyHint = document.getElementById('empty-hint');
var procVideo = document.getElementById('proc-video');
var procCanvas= document.getElementById('proc-canvas');

// ─── Settings ─────────────────────────────────────────────────────────────
var MAX_SIZE_BYTES = 50 * 1024 * 1024; // 50MB hard cap

function getSettings() {
  return {
    duration: parseInt(document.getElementById('setting-duration').value),
    fps:      parseInt(document.getElementById('setting-fps').value),
    width:    parseInt(document.getElementById('setting-width').value),
    quality:  parseInt(document.getElementById('setting-quality').value)
  };
}

// Estimate GIF size in bytes: width * height * fps * duration * bytes_per_pixel_compressed
function estimateSize(settings) {
  var aspect = 16/9;
  var height = Math.round(settings.width / aspect);
  var frames = settings.duration * settings.fps;
  // empirical: ~0.5 bytes per pixel per frame after LZW at quality 10
  return settings.width * height * frames * 0.5;
}

// Auto-reduce settings to fit under 50MB, returns adjusted settings
function fitSettings(settings) {
  var s = Object.assign({}, settings);
  var attempts = 0;
  while (estimateSize(s) > MAX_SIZE_BYTES && attempts < 20) {
    // Priority: reduce fps first, then width, then duration
    if (s.fps > 8) { s.fps = 8; }
    else if (s.width > 480) { s.width = 480; }
    else if (s.width > 320) { s.width = 320; }
    else if (s.duration > 15) { s.duration = 15; }
    else if (s.duration > 10) { s.duration = 10; }
    else if (s.duration > 5) { s.duration = 5; }
    else { s.quality = Math.min(s.quality + 3, 20); } // last resort: reduce quality
    attempts++;
  }
  return s;
}
document.getElementById('setting-quality').addEventListener('input', function() {
  document.getElementById('quality-val').textContent = this.value;
  updateSizePreview();
});

// Update size preview on any setting change
['setting-duration', 'setting-fps', 'setting-width'].forEach(function(id) {
  document.getElementById(id).addEventListener('change', updateSizePreview);
});

function updateSizePreview() {
  var s = getSettings();
  var bytes = estimateSize(s);
  var mb = bytes / (1024 * 1024);
  var pct = Math.min((mb / 50) * 100, 100);

  var valEl  = document.getElementById('size-preview-val');
  var barEl  = document.getElementById('size-bar-fill');

  valEl.textContent = mb.toFixed(1) + ' MB';
  barEl.style.width = pct + '%';

  // Colour thresholds: green < 35MB, amber 35–50MB, red > 50MB
  var state = mb < 35 ? 'ok' : mb < 50 ? 'warn' : 'over';
  valEl.className  = 'size-preview-val'  + (state !== 'ok' ? ' ' + state : '');
  barEl.className  = 'size-bar-fill'     + (state !== 'ok' ? ' ' + state : '');
}

// Run once on load to show initial estimate
updateSizePreview();

// ─── Input handling ────────────────────────────────────────────────────────
urlInput.addEventListener('input', function() {
  var urls = parseURLs();
  urlCount.textContent = urls.length ? urls.length + ' URL' + (urls.length !== 1 ? 's' : '') : '';
  loadBtn.disabled = urls.length === 0;
});

document.getElementById('clear-btn').addEventListener('click', function() {
  urlInput.value = ''; urlCount.textContent = ''; loadBtn.disabled = true;
});

loadBtn.addEventListener('click', function() {
  var urls = parseURLs();
  if (!urls.length) return;
  loadBtn.disabled = true;
  pendingDownloads = [];
  startBatch(urls);
  // Start a pump that drains pendingDownloads every 800ms
  // This runs within the trusted click thread context via interval
  clearInterval(autoDownloadInterval);
  autoDownloadInterval = setInterval(function() {
    if (pendingDownloads.length > 0) {
      var next = pendingDownloads.shift();
      var a = document.createElement('a');
      a.href = next.url;
      a.download = next.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }
  }, 800);
});

function parseURLs() {
  return urlInput.value.split('\n')
    .map(function(l) { return l.trim(); })
    .filter(function(l) { return l.length > 0 && l.indexOf('tiktok.com') !== -1; });
}

// ─── Batch start ──────────────────────────────────────────────────────────
function startBatch(urls) {
  emptyHint.style.display = 'none';
  var startId = items.length;
  urls.forEach(function(url, i) {
    var id = startId + i;
    items.push({ id: id, url: url, handle: extractHandle(url), videoId: extractVideoId(url), status: 'pending', gifBlob: null, error: null });
    appendCard(items[id]);
  });
  // Process sequentially to avoid overloading memory
  processQueue(startId, urls.length);
}

async function processQueue(startId, count) {
  for (var i = 0; i < count; i++) {
    var id = startId + i;
    await processItem(id);
  }
  showToast('All done! ' + count + ' GIF' + (count !== 1 ? 's' : '') + ' converted', 'success');
  // Stop the pump after a delay to let the last download flush
  setTimeout(function() { clearInterval(autoDownloadInterval); }, 5000);
}

// ─── Single item pipeline ─────────────────────────────────────────────────
async function processItem(id) {
  var item = items[id];

  // 1. Fetch MP4 URL from tikwm
  setStatus(id, 'fetching', 'Fetching video link…');
  var mp4url = await fetchMP4(item.url);
  if (!mp4url) { setStatus(id, 'error', 'Failed to fetch video'); return; }

  // 2. Check settings and auto-reduce if needed
  var settings = getSettings();
  var fitted = fitSettings(settings);
  var wasReduced = (fitted.fps !== settings.fps || fitted.width !== settings.width || fitted.duration !== settings.duration);
  if (wasReduced) {
    showToast('Settings auto-adjusted to stay under 50MB: ' + fitted.width + 'px / ' + fitted.fps + 'fps / ' + fitted.duration + 's', 'info');
    updateSettingsUI(fitted);
  }

  // 3. Capture frames
  setStatus(id, 'capturing', 'Capturing frames… (' + fitted.duration + 's @ ' + fitted.fps + 'fps)');
  var frames = await captureFrames(mp4url, fitted);
  if (!frames || frames.length === 0) { setStatus(id, 'error', 'Failed to capture frames'); return; }

  // 4. Encode GIF
  setStatus(id, 'encoding', 'Encoding GIF… (0%)');
  var blob = await encodeGIF(id, frames, fitted);
  if (!blob) { setStatus(id, 'error', 'GIF encoding failed'); return; }

  // 5. Final size check — if still over 50MB re-encode at lower quality
  if (blob.size > MAX_SIZE_BYTES) {
    setStatus(id, 'encoding', 'Too large, re-encoding…');
    fitted.quality = Math.min(fitted.quality + 5, 20);
    fitted.fps = Math.max(fitted.fps - 2, 6);
    blob = await encodeGIF(id, frames, fitted);
  }

  // 6. Done
  item.gifBlob = blob;
  var sizeStr = formatBytes(blob.size);
  var overLimit = blob.size > MAX_SIZE_BYTES;
  setStatus(id, overLimit ? 'error' : 'done', overLimit ? 'Still over 50MB (' + sizeStr + ')' : 'Ready — ' + sizeStr);
  showPreview(id, blob);
  if (!overLimit) enableDownload(id);
  else showToast('Could not reduce ' + item.handle + ' below 50MB. Try lower duration or FPS.', 'error');
}

function updateSettingsUI(s) {
  document.getElementById('setting-fps').value = s.fps;
  document.getElementById('setting-width').value = s.width;
  document.getElementById('setting-duration').value = s.duration;
  document.getElementById('setting-quality').value = s.quality;
  document.getElementById('quality-val').textContent = s.quality;
}

// ─── Fetch MP4 URL ─────────────────────────────────────────────────────────
async function fetchMP4(tiktokUrl) {
  try {
    var res = await fetch('https://www.tikwm.com/api/?url=' + encodeURIComponent(tiktokUrl));
    var data = await res.json();
    if (data.code === 0 && data.data) {
      return data.data.play || data.data.wmplay || null;
    }
    return null;
  } catch(e) { return null; }
}

// ─── Capture frames via hidden video + canvas ──────────────────────────────
function captureFrames(mp4url, settings) {
  return new Promise(function(resolve) {
    var video = procVideo;
    var canvas = procCanvas;
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var frames = [];
    var duration = settings.duration;
    var fps = settings.fps;
    var width = settings.width;
    var totalFrames = duration * fps;
    var interval = 1 / fps;
    var currentFrame = 0;

    video.src = mp4url;
    video.load();

    video.addEventListener('error', function() { resolve(null); }, { once: true });

    video.addEventListener('loadedmetadata', function() {
      var vidDuration = Math.min(video.duration, duration);
      var aspect = video.videoHeight / video.videoWidth;
      var height = Math.round(width * aspect);
      // ensure even numbers
      if (width % 2 !== 0) width--;
      if (height % 2 !== 0) height--;
      canvas.width  = width;
      canvas.height = height;
      totalFrames = Math.floor(vidDuration * fps);

      function seekNext() {
        if (currentFrame >= totalFrames) { resolve(frames); return; }
        var t = currentFrame * interval;
        video.currentTime = Math.min(t, video.duration - 0.05);
        currentFrame++;
      }

      video.addEventListener('seeked', function onSeeked() {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        frames.push({ imageData: imageData, width: canvas.width, height: canvas.height });
        if (currentFrame < totalFrames) {
          seekNext();
        } else {
          video.removeEventListener('seeked', onSeeked);
          resolve(frames);
        }
      });

      seekNext();
    }, { once: true });
  });
}

// ─── Encode GIF using gif.js ───────────────────────────────────────────────
function encodeGIF(id, frames, settings) {
  return new Promise(function(resolve) {
    var tempCanvas = document.createElement('canvas');
    tempCanvas.width  = frames[0].width;
    tempCanvas.height = frames[0].height;
    var ctx = tempCanvas.getContext('2d', { willReadFrequently: true });

    var gif = new GIF({
      workers: 2,
      quality: settings.quality,
      width:   frames[0].width,
      height:  frames[0].height,
      workerScript: window._gifWorkerURL,
      repeat: 0
    });

    var delay = Math.round(1000 / settings.fps);
    frames.forEach(function(f) {
      ctx.putImageData(f.imageData, 0, 0);
      gif.addFrame(tempCanvas, { copy: true, delay: delay });
    });

    gif.on('progress', function(p) {
      var pct = Math.round(p * 100);
      setStatus(id, 'encoding', 'Encoding GIF… (' + pct + '%)');
      updateCardProgress(id, pct);
    });

    gif.on('finished', function(blob) { resolve(blob); });
    gif.on('error', function() { resolve(null); });
    gif.render();
  });
}

// ─── Card rendering ────────────────────────────────────────────────────────
function appendCard(item) {
  var div = document.createElement('div');
  div.className = 'gif-card';
  div.id = 'card-' + item.id;
  div.innerHTML = cardHTML(item);
  videoGrid.appendChild(div);
}

function cardHTML(item) {
  return '<div class="card-header">' +
    '<div class="card-avatar">' + getInitials(item.handle) + '</div>' +
    '<div class="card-info">' +
      '<div class="card-handle">' + item.handle + '</div>' +
      '<div class="card-url">' + item.url + '</div>' +
    '</div>' +
    '<div class="card-status"><span class="status-badge s-pending" id="badge-' + item.id + '">Pending</span></div>' +
  '</div>' +
  '<div class="card-body">' +
    '<div class="card-preview" id="preview-' + item.id + '"><span style="font-size:11px;color:var(--text-dim)">Preview</span></div>' +
    '<div class="card-progress-wrap">' +
      '<div class="card-progress-label" id="prog-label-' + item.id + '">Waiting…<span id="prog-pct-' + item.id + '"></span></div>' +
      '<div class="progress-track"><div class="progress-fill" id="prog-' + item.id + '" style="width:0%"></div></div>' +
      '<div class="card-actions" id="actions-' + item.id + '"></div>' +
    '</div>' +
  '</div>';
}

function setStatus(id, status, label) {
  items[id].status = status;
  var badge = document.getElementById('badge-' + id);
  if (!badge) return;
  var classMap = { pending:'s-pending', fetching:'s-fetching', capturing:'s-capturing', encoding:'s-encoding', done:'s-done', error:'s-error' };
  var spinStatuses = { fetching:true, capturing:true, encoding:true };
  badge.className = 'status-badge ' + (classMap[status] || 's-pending');
  badge.innerHTML = (spinStatuses[status] ? '<span class="spin">&#8635;</span> ' : '') + (label || status);
  var progLabel = document.getElementById('prog-label-' + id);
  if (progLabel) progLabel.innerHTML = label || status;
  if (status === 'done' || status === 'error') {
    var prog = document.getElementById('prog-' + id);
    if (prog) prog.style.width = status === 'done' ? '100%' : '0%';
    if (status === 'done' && prog) prog.style.background = 'var(--green)';
    if (status === 'error' && prog) prog.style.background = 'var(--accent)';
  }
}

function updateCardProgress(id, pct) {
  var prog = document.getElementById('prog-' + id);
  if (prog) prog.style.width = pct + '%';
  var pctEl = document.getElementById('prog-pct-' + id);
  if (pctEl) pctEl.textContent = pct + '%';
}

function showPreview(id, blob) {
  var preview = document.getElementById('preview-' + id);
  if (!preview) return;
  var url = URL.createObjectURL(blob);
  preview.innerHTML = '<img src="' + url + '" alt="GIF preview">';
}

function enableDownload(id) {
  var item = items[id];
  if (!item.gifBlob) return;
  var actions = document.getElementById('actions-' + id);
  if (!actions) return;
  var filename = item.handle + '.gif';
  var blobUrl = URL.createObjectURL(item.gifBlob);

  // Queue for auto-download via the interval pump
  pendingDownloads.push({ url: blobUrl, filename: filename });

  // Show manual fallback button
  actions.innerHTML =
    '<a class="dl-btn dl-btn-gif" href="' + blobUrl + '" download="' + filename + '">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
      'Download Again' +
    '</a>';
}

// ─── Helpers ───────────────────────────────────────────────────────────────
function extractHandle(url) { var m = url.match(/@([^\/\?]+)/); return m ? '@' + m[1] : '@unknown'; }
function extractVideoId(url) { var m = url.match(/video\/(\d+)/); return m ? m[1] : '???'; }
function getInitials(h) { var s = h.replace('@',''); return s.length >= 2 ? s.slice(0,2).toUpperCase() : s.toUpperCase(); }
function formatBytes(b) { if (b < 1024*1024) return (b/1024).toFixed(0)+'KB'; return (b/1024/1024).toFixed(1)+'MB'; }

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : type === 'success' ? ' success' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, 4000);
}
</script>
